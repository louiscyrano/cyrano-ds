<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logos/cyrano_square_white.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cyrano — Design System</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('cy-theme') || 'dark';
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
