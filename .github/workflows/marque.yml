# La marque Cyrano (packages/marque) : verifiee sur chaque PR, publiee en release apres fusion.
# Une release par version de packages/marque/package.json, etiquette marque-v<version>, jamais
# republiee : les releases du depot sont immuables, une URL donne toujours le meme paquet.
name: marque

on:
  push:
    branches: [main]
    paths: ['packages/marque/**', 'public/logos/**', 'public/fonts/**', '.github/workflows/marque.yml']
  pull_request:
    paths: ['packages/marque/**', 'public/logos/**', 'public/fonts/**', '.github/workflows/marque.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  marque:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/marque
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verifier (source valide, generation deterministe)
        run: node generer.mjs --verifier
      - name: Generer
        run: node generer.mjs
      - name: Empaqueter
        run: npm pack
      - name: Publier la release si la version est nouvelle
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="marque-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG existe deja : rien a publier. Pour publier, augmenter la version de packages/marque/package.json."
            exit 0
          fi
          FICHIER="cyrano-marque-$VERSION.tgz"
          EMPREINTE=$(sha256sum "$FICHIER" | cut -d' ' -f1)
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/$FICHIER"
          printf 'La marque Cyrano, version %s.\n\nInstaller : `pnpm add %s` (ou `npm install`).\n\nsha256 : `%s`\n' "$VERSION" "$URL" "$EMPREINTE" > notes.md
          gh release create "$TAG" "$FICHIER" --title "Marque $VERSION" --notes-file notes.md --target "$GITHUB_SHA"
